[node]
# Node configuration
node_id = "fractalchain-node-01"
data_dir = "./fractalchain-data"
chain_id = 859

# Network configuration
[network]
listen_address = "0.0.0.0:30303"
bootstrap_nodes = []
max_peers = 50
min_peers = 25

# Blockchain configuration
[blockchain]
genesis_file = "genesis.json"
consensus = "fractal"
block_time = 2
block_gas_limit = 30000000

# Fractal sharding configuration
[fractal]
shards = 64
shard_size = 1000
recursive_depth = 3
enable_cross_shard = true

# Consensus configuration
[consensus]
validators = 100
finality_threshold = 0.67
epoch_length = 100
slashing_enabled = true

# Performance configuration
[performance]
enable_monitoring = true
metrics_port = 9090
enable_profiling = false

# Database configuration
[database]
db_path = "./fractalchain-data/db"
max_open_files = 1000

# Logging configuration
[logging]
level = "info"
enable_file_logging = true
log_file = "fractalchain.log"

# Development configuration
[dev]
debug_mode = false
enable_test_accounts = true
fast_sync = true