[package]
name = "fractalchain-types"
version = "0.1.0"
edition = "2021"
authors = ["FRACTALCHAIN Core Team"]
description = "Core types for FRACTALCHAIN blockchain"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lilythecat859/fractalchain"
homepage = "https://fractalchain.io"
documentation = "https://docs.fractalchain.io"
keywords = ["blockchain", "fractal", "sharding", "types"]
categories = ["cryptography", "data-structures"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4"] }
hex = "0.4"
sha2 = "0.10"
bls12_381 = "0.8"
num-complex = "0.4"

[dev-dependencies]
proptest = "1.0"
tokio-test = "0.4"