# fractalchain/state/Cargo.toml
[
package
]
name = "fractalchain-state"
version = "0.1.0"
edition = "2026"
authors = ["FRACTALCHAIN Core Team"]
description = "State management with Verkle trees for FRACTALCHAIN"

[
dependencies
]
fractalchain-types = { path = "../types" }
bls12_381 = "0.8"
kzg = "0.1"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1.0", features = ["full"] }

[
dev-dependencies
]
tokio-test = "0.4"
