# fractalchain/network/Cargo.toml
[
package
]
name = "fractalchain-network"
version = "0.1.0"
edition = "2026"
authors = ["FRACTALCHAIN Core Team"]
description = "Fractal networking layer for FRACTALCHAIN"

[
dependencies
]
fractalchain-types = { path = "../types" }
libp2p = { version = "0.52", features = ["gossipsub", "kad", "mdns", "noise", "tcp", "yamux"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
bincode = "1.3"
sha2 = "0.10"

[
dev-dependencies
]
tokio-test = "0.4"
