# fractalchain/cmd/Cargo.toml
[
package
]
name = "fractalchain-cmd"
version = "0.1.0"
edition = "2026"
authors = ["FRACTALCHAIN Core Team"]
description = "FRACTALCHAIN node binary and CLI"

[[
bin
]]
name = "fractalchain"
path = "src/main.rs"

[
dependencies
]
fractalchain-types = { path = "../types" }
fractalchain-consensus = { path = "../consensus" }
fractalchain-network = { path = "../network" }
fractalchain-evm = { path = "../evm" }
fractalchain-state = { path = "../state" }
clap = { version = "4.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
sha2 = "0.10"
hex = "0.4"
libp2p = "0.52"
num-complex = "0.4"

[
dev-dependencies
]
tokio-test = "0.4"
