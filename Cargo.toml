[package]
name = "fractalchain"
version = "0.1.0"
edition = "2021"
authors = ["FRACTALCHAIN Core Team"]
description = "The world's fastest, cheapest, most scalable L1 blockchain with recursive fractal sharding"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lilythecat859/fractalchain"
homepage = "https://fractalchain.io"
documentation = "https://docs.fractalchain.io"
keywords = ["blockchain", "fractal", "sharding", "evm", "consensus"]
categories = ["cryptography", "data-structures", "network-programming"]

[workspace]
members = [
    "types",
]

[dependencies]
fractalchain-types = { path = "types" }

# Core dependencies
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"